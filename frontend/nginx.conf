# 1. Catch-all block for HTTP (Port 80)
# Dacă cineva accesează direct IP-ul, îi închidem conexiunea instant (Eroare 444)
server {
    listen 80 default_server;
    server_name _;
    return 444; 
}

# 2. Catch-all block for HTTPS (Port 443)
# La fel și pentru HTTPS direct pe IP
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    return 444; 
}

# 3. Redirecționare doar pentru domeniu (HTTP -> HTTPS)
server {
    listen 80;
    server_name atmt-sdv.com www.atmt-sdv.com;
    return 301 https://$host$request_uri;
}

# 4. Blocul principal al aplicației (Accesibil doar prin domeniu)
server {
    listen 443 ssl;
    server_name atmt-sdv.com www.atmt-sdv.com;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    # Modern SSL configurations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers (Best Practices)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy (CSP) - Ultra-Strict (A+ pe Mozilla Observatory)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none';" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    location /api/ {
        proxy_pass http://backend:5000/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
